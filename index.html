<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SuperGraph Pro 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.min.js"></script>
    <style>
        :root {
            --bg: #0f0f1a;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text: #e0e0e0;
            --text-muted: #a0a0b0;
            --primary: #6c63ff;
            --primary-dark: #5a52e0;
            --accent: #00d4ff;
            --gradient: linear-gradient(135deg, #6c63ff 0%, #00d4ff 100%);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }

        .page {
            flex: 0 0 100%;
            height: 100%;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            background: transparent;
            position: relative;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius);
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input,
        select {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.3);
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        input:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.3);
        }

        button {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }
        button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.2s;
        }
        button:hover {
            filter: brightness(1.1);
            box-shadow: 0 6px 20px rgba(108, 99, 255, 0.6);
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(108, 99, 255, 0.4);
        }
        button:active::after {
            opacity: 1;
        }
        button.secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: none;
            margin-top: 0.8rem;
        }
        button.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .chart-container {
            width: 100%;
            height: 55vh;
            margin: 1.5rem 0;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 10px;
        }

        .nav-dots {
            display: flex;
            justify-content: center;
            margin-top: auto;
            gap: 0.8rem;
            padding: 1rem 0;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            cursor: pointer;
        }
        .dot.active {
            background: var(--accent);
            transform: scale(1.3);
            box-shadow: 0 0 10px var(--accent);
        }

        .calculator {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 1.5rem;
        }
        .calculator button {
            aspect-ratio: 1/1;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        .calculator-display {
            grid-column: span 4;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: right;
            font-size: 2rem;
            margin-bottom: 10px;
            height: 70px;
            overflow: hidden;
            color: #fff;
            font-weight: 300;
            letter-spacing: 1px;
        }
        .span-2 {
            grid-column: span 2;
            aspect-ratio: 2/1;
        }
        .tab-buttons {
            display: flex;
            margin-bottom: 1.2rem;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--surface-border);
        }
        .tab-button {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .tab-button.active {
            background: var(--gradient);
            color: white;
        }
        .hidden {
            display: none !important;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .page {
                padding: 16px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .card {
                padding: 1.2rem;
            }
            .calculator button {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="page-container">
        <!-- Page 1: Mode Selection -->
        <div class="page" id="page1">
            <h1>SuperGraph Pro</h1>
            <div class="card">
                <p style="margin-bottom: 1.8rem; color: var(--text-muted); text-align: center;">Choose your tool</p>
                <button id="goto-calculator" style="margin-bottom: 0.8rem;">🧮 &nbsp;Calculator</button>
                <button id="goto-grapher" class="secondary">📈 &nbsp;Data Grapher</button>
            </div>
            <div class="nav-dots">
                <div class="dot active" data-page="1"></div>
                <div class="dot" data-page="2"></div>
                <div class="dot" data-page="3"></div>
            </div>
        </div>

        <!-- Page 2: Calculator -->
        <div class="page" id="page2">
            <h1>Scientific Calculator</h1>
            <div class="tab-buttons">
                <button class="tab-button active" data-tab="basic">Basic</button>
                <button class="tab-button" data-tab="scientific">Scientific</button>
            </div>
            <div class="calculator-display" id="calc-display">0</div>
            <div class="calculator" id="basic-calculator">
                <button class="calc-btn" data-value="C">C</button>
                <button class="calc-btn" data-value="±">±</button>
                <button class="calc-btn" data-value="%">%</button>
                <button class="calc-btn operator" data-value="/">÷</button>
                <button class="calc-btn" data-value="7">7</button>
                <button class="calc-btn" data-value="8">8</button>
                <button class="calc-btn" data-value="9">9</button>
                <button class="calc-btn operator" data-value="*">×</button>
                <button class="calc-btn" data-value="4">4</button>
                <button class="calc-btn" data-value="5">5</button>
                <button class="calc-btn" data-value="6">6</button>
                <button class="calc-btn operator" data-value="-">−</button>
                <button class="calc-btn" data-value="1">1</button>
                <button class="calc-btn" data-value="2">2</button>
                <button class="calc-btn" data-value="3">3</button>
                <button class="calc-btn operator" data-value="+">+</button>
                <button class="calc-btn span-2" data-value="0">0</button>
                <button class="calc-btn" data-value=".">.</button>
                <button class="calc-btn operator" data-value="=">=</button>
            </div>
            <div class="calculator hidden" id="scientific-calculator">
                <button class="calc-btn" data-value="sin(">sin</button>
                <button class="calc-btn" data-value="cos(">cos</button>
                <button class="calc-btn" data-value="tan(">tan</button>
                <button class="calc-btn operator" data-value="^">^</button>
                <button class="calc-btn" data-value="log(">log</button>
                <button class="calc-btn" data-value="ln(">ln</button>
                <button class="calc-btn" data-value="sqrt(">√</button>
                <button class="calc-btn" data-value="(">(</button>
                <button class="calc-btn" data-value=")">)</button>
                <button class="calc-btn" data-value="pi">π</button>
                <button class="calc-btn" data-value="e">e</button>
                <button class="calc-btn operator" data-value="factorial(">!</button>
                <button class="calc-btn span-2" data-value="C">Clear</button>
                <button class="calc-btn" data-value="back">⌫</button>
                <button class="calc-btn operator" data-value="=">=</button>
            </div>
            <button class="secondary" id="back-to-home">← Back to Home</button>
            <div class="nav-dots">
                <div class="dot" data-page="1"></div>
                <div class="dot active" data-page="2"></div>
                <div class="dot" data-page="3"></div>
            </div>
        </div>

        <!-- Page 3: Grapher -->
        <div class="page" id="page3">
            <h1>Data Grapher</h1>
            <div class="card">
                <div class="input-group">
                    <label for="graph-type">Graph Type</label>
                    <select id="graph-type">
                        <option value="line">Line Chart</option>
                        <option value="bar">Bar Chart</option>
                        <option value="pie">Pie Chart</option>
                        <option value="scatter">Scatter Plot</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="data-points">Number of Points (2-20)</label>
                    <input type="number" id="data-points" min="2" max="20" value="5">
                </div>
                <button id="generate-inputs">Continue</button>
            </div>
            <div id="graph-input-section" style="display:none;">
                <div class="card">
                    <h2 style="font-size: 1.3rem; margin-bottom: 1rem;">Enter Your Data</h2>
                    <div id="value-inputs"></div>
                    <button id="generate-graph">Generate Graph</button>
                </div>
            </div>
            <div class="chart-container" id="chart-container" style="display:none;">
                <canvas id="dataChart"></canvas>
            </div>
            <button class="secondary" id="back-to-home-2">← Back to Home</button>
            <div class="nav-dots">
                <div class="dot" data-page="1"></div>
                <div class="dot" data-page="2"></div>
                <div class="dot active" data-page="3"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- Navigation ----------
            const container = document.getElementById('page-container');
            let currentPage = 1;

            function showPage(pageNumber) {
                currentPage = pageNumber;
                container.style.transform = `translateX(-${(pageNumber - 1) * 100}%)`;
                updateDots();
                // Reset graph section when returning to page 3
                if (pageNumber === 3) {
                    document.getElementById('graph-input-section').style.display = 'none';
                    document.getElementById('chart-container').style.display = 'none';
                }
            }

            function updateDots() {
                document.querySelectorAll('.nav-dots .dot').forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentPage - 1);
                });
            }

            // Dot navigation
            document.querySelectorAll('.nav-dots .dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    const page = parseInt(dot.dataset.page);
                    if (!isNaN(page)) showPage(page);
                });
            });

            // Buttons
            document.getElementById('goto-calculator').addEventListener('click', () => showPage(2));
            document.getElementById('goto-grapher').addEventListener('click', () => showPage(3));
            document.getElementById('back-to-home').addEventListener('click', () => showPage(1));
            document.getElementById('back-to-home-2').addEventListener('click', () => showPage(1));

            // ---------- Calculator ----------
            const calcDisplay = document.getElementById('calc-display');
            let calcExpression = '';
            let lastResult = null;

            function updateDisplay() {
                let display = calcExpression
                    .replace(/\*/g, '×')
                    .replace(/\//g, '÷')
                    .replace(/-/g, '−'); // Replace minus for display consistency
                calcDisplay.textContent = display || '0';
            }

            function evaluateExpression() {
                try {
                    // Math.js already understands pi, e, sin, cos, etc.
                    const result = math.evaluate(calcExpression);
                    calcExpression = result.toString();
                    lastResult = result;
                    updateDisplay();
                } catch (error) {
                    calcDisplay.textContent = 'Error';
                    calcExpression = '';
                    lastResult = null;
                }
            }

            function handleCalcButton(value) {
                switch (value) {
                    case 'C':
                        calcExpression = '';
                        lastResult = null;
                        updateDisplay();
                        break;
                    case '±':
                        // Toggle sign of entire expression robustly
                        if (calcExpression) {
                            try {
                                const val = math.evaluate(calcExpression);
                                if (typeof val === 'number') {
                                    calcExpression = (-val).toString();
                                    lastResult = null;
                                    updateDisplay();
                                }
                            } catch (e) { /* ignore */ }
                        }
                        break;
                    case 'back':
                        calcExpression = calcExpression.slice(0, -1);
                        updateDisplay();
                        break;
                    case '=':
                        evaluateExpression();
                        break;
                    default:
                        // If last result exists and user starts with operator, append to last result
                        if (lastResult !== null && ['+', '-', '*', '/', '^'].includes(value) && calcExpression === '') {
                            calcExpression = lastResult.toString();
                        }
                        calcExpression += value;
                        lastResult = null;
                        updateDisplay();
                }
            }

            // Button click events
            document.querySelectorAll('.calc-btn').forEach(btn => {
                btn.addEventListener('click', () => handleCalcButton(btn.dataset.value));
            });

            // Keyboard support
            document.addEventListener('keydown', (e) => {
                const key = e.key;
                if (currentPage === 2) {
                    if (/^[0-9+\-*/.^()%]$/.test(key)) {
                        e.preventDefault();
                        handleCalcButton(key);
                    } else if (key === 'Enter') {
                        e.preventDefault();
                        handleCalcButton('=');
                    } else if (key === 'Backspace') {
                        e.preventDefault();
                        handleCalcButton('back');
                    } else if (key === 'Escape') {
                        e.preventDefault();
                        handleCalcButton('C');
                    } else if (key === 'p' || key === 'P') {
                        e.preventDefault();
                        handleCalcButton('pi');
                    } else if (key === 'e' || key === 'E') {
                        e.preventDefault();
                        handleCalcButton('e');
                    }
                }
            });

            // Tab switching
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('basic-calculator').classList.toggle('hidden', tab !== 'basic');
                    document.getElementById('scientific-calculator').classList.toggle('hidden', tab !== 'scientific');
                });
            });

            // ---------- Grapher ----------
            document.getElementById('generate-inputs').addEventListener('click', () => {
                const numPoints = parseInt(document.getElementById('data-points').value);
                const graphType = document.getElementById('graph-type').value;

                if (isNaN(numPoints) || numPoints < 2 || numPoints > 20) {
                    alert('Please enter a number between 2 and 20');
                    return;
                }

                const valueInputsDiv = document.getElementById('value-inputs');
                valueInputsDiv.innerHTML = '';

                for (let i = 0; i < numPoints; i++) {
                    const div = document.createElement('div');
                    div.className = 'input-group';

                    if (graphType === 'scatter') {
                        div.innerHTML = `
                            <label>Point ${i+1} (X, Y)</label>
                            <div style="display: flex; gap: 10px;">
                                <input type="number" id="value-x-${i}" placeholder="X value" style="flex:1;">
                                <input type="number" id="value-y-${i}" placeholder="Y value" style="flex:1;">
                            </div>
                        `;
                    } else {
                        div.innerHTML = `
                            <label>Value ${i+1}</label>
                            <input type="number" id="value-${i}" placeholder="Enter value">
                        `;
                    }
                    valueInputsDiv.appendChild(div);
                }
                document.getElementById('graph-input-section').style.display = 'block';
            });

            document.getElementById('generate-graph').addEventListener('click', () => {
                const graphType = document.getElementById('graph-type').value;
                const numPoints = parseInt(document.getElementById('data-points').value);

                let labels = [];
                let data = [];
                let scatterData = [];

                if (graphType === 'scatter') {
                    for (let i = 0; i < numPoints; i++) {
                        const xVal = parseFloat(document.getElementById(`value-x-${i}`).value) || 0;
                        const yVal = parseFloat(document.getElementById(`value-y-${i}`).value) || 0;
                        scatterData.push({ x: xVal, y: yVal });
                        labels.push(`(${xVal}, ${yVal})`);
                    }
                    data = scatterData;
                } else {
                    for (let i = 0; i < numPoints; i++) {
                        const val = parseFloat(document.getElementById(`value-${i}`).value) || 0;
                        data.push(val);
                        labels.push(`Point ${i+1}`);
                    }
                }

                renderChart(graphType, labels, data);
                document.getElementById('chart-container').style.display = 'block';
            });

            let chartInstance = null;

            function renderChart(type, labels, data) {
                const ctx = document.getElementById('dataChart').getContext('2d');
                if (chartInstance) chartInstance.destroy();

                const isScatter = type === 'scatter';
                const isPie = type === 'pie';

                const config = {
                    type: isScatter ? 'scatter' : type,
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Your Data',
                            data: data,
                            borderColor: isScatter ? '#00d4ff' : '#6c63ff',
                            backgroundColor: isPie ? [
                                '#6c63ff', '#00d4ff', '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff'
                            ] : isScatter ? '#00d4ff' : 'rgba(108, 99, 255, 0.2)',
                            borderWidth: 2,
                            pointBackgroundColor: isScatter ? '#00d4ff' : undefined,
                            pointRadius: isScatter ? 6 : undefined,
                            showLine: isScatter ? false : undefined,
                            fill: !isPie && !isScatter && type !== 'bar'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: { color: '#e0e0e0' }
                            },
                            tooltip: { enabled: true }
                        },
                        scales: isPie ? {} : {
                            x: isScatter ? {
                                type: 'linear',
                                position: 'bottom',
                                grid: { color: 'rgba(255,255,255,0.1)' },
                                ticks: { color: '#a0a0b0' }
                            } : {
                                grid: { color: 'rgba(255,255,255,0.1)' },
                                ticks: { color: '#a0a0b0' }
                            },
                            y: {
                                beginAtZero: !isScatter,
                                grid: { color: 'rgba(255,255,255,0.1)' },
                                ticks: { color: '#a0a0b0' }
                            }
                        }
                    }
                };

                chartInstance = new Chart(ctx, config);
            }

            // Initialize
            showPage(1);
        })();
    </script>
</body>

</html>
